spring.application.name=CafeCatchtable

# ---------- Oracle DataSource ----------
# 계정은 Document/01_create_oracle_user.sql 기준(CAFE_CATCHTABLE / 1234).
# 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD)로 덮어쓸 수 있습니다. URL(SID/서비스명)은 각자 설치 환경에 맞게 수정하세요.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:CAFE_CATCHTABLE}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---------- JPA ----------
# 스키마·프로시저·트리거는 SQL Developer 스크립트(db/)가 관리하므로 Hibernate는 DDL을 건드리지 않습니다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- 세션 (FR-02: 30분 미사용 시 만료) ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ---------- 인코딩 ----------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
