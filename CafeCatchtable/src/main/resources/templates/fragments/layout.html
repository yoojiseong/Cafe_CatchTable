<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 모든 화면이 공유하는 <head>와 헤더(네비게이션) 조각 -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · 카페 캐치테이블'">카페 캐치테이블</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/app.js}"></script>
</head>
<body>

<header th:fragment="header" class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/cafes" aria-label="카페 캐치테이블 홈">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="3" y="10" width="20" height="16" rx="4" fill="currentColor"/>
        <path d="M23 13h2.5a3.5 3.5 0 0 1 0 7H23" stroke="currentColor" stroke-width="2.5"/>
        <path d="M9 3c0 2 2 2 2 4M15 3c0 2 2 2 2 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      카페 캐치테이블
    </a>
    <nav class="nav" aria-label="주 메뉴">
      <a href="/cafes">카페 찾기</a>
      <a href="/mypage" data-show="member" hidden>마이페이지</a>
      <a href="/owner/cafes" data-show="owner" hidden>매장 관리</a>
      <a href="/owner/reservations" data-show="owner" hidden>예약 현황</a>
      <a href="/owner/stats" data-show="owner" hidden>통계</a>
    </nav>
    <div class="user-box">
      <span data-slot="user-name" data-show="member" hidden></span>
      <button type="button" class="btn btn--ghost btn--sm" data-action="logout" data-show="member" hidden>로그아웃</button>
      <a class="btn btn--sm" href="/login" data-show="guest" hidden>로그인</a>
    </div>
  </div>
</header>

</body>
</html>
